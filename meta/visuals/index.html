<!doctype html><html><head><meta charset="utf-8"><title>CWSAgent localized screenshot artwork</title><script src="strings.js"></script><style>
*{box-sizing:border-box}html,body{margin:0;width:1280px;height:800px;overflow:hidden}body{background:#eef4ff;color:#13243b;font-family:-apple-system,BlinkMacSystemFont,'Arial',sans-serif}header{height:105px;display:flex;align-items:center;gap:16px;padding:35px 58px;font-size:27px;font-weight:700}header img{width:42px;height:42px}.mark{margin-inline-start:auto;font-family:Arial;font-size:18px;letter-spacing:3px;color:#245fbb}.hero{padding:12px 58px 0;position:relative}h1{font-size:62px;letter-spacing:-2px;line-height:1.08;margin:0;width:1150px;height:137px;font-weight:750;color:#092d65}p{font-size:25px;line-height:1.4;margin:12px 0;width:1120px;height:83px;color:#254365;font-weight:500}.stage{height:348px;margin:24px 58px;background:white;border:2px solid #b5c7e4;border-radius:23px;box-shadow:0 16px 0 #dce6f5;padding:30px;display:flex;align-items:center;justify-content:center;gap:22px;direction:ltr}.pane{border:2px solid #bad0ee;border-radius:14px;background:#f8fbff;padding:23px;width:360px;height:260px;display:flex;flex-direction:column;gap:15px;justify-content:center}.bar{height:12px;background:#d4e1f2;border-radius:6px;width:88%}.bar:nth-child(2){width:68%}.bar:nth-child(3){width:80%}.button{padding:16px 26px;background:#0b57d0;color:white;border-radius:12px;font-weight:700;font-size:27px;text-align:center}.arrow{font-size:58px;color:#0b57d0}.glyph{font-size:76px;color:#0b57d0;line-height:1.1;text-align:center}.code{font:21px/1.65 monospace;color:#193a68;white-space:pre}.lang-grid{display:flex;flex-wrap:wrap;gap:9px;width:650px;justify-content:center}.chip{font:700 21px Arial;background:#eef4ff;border:1px solid #afc7e9;border-radius:8px;padding:12px 16px}.pill{padding:15px 22px;background:#e4eeff;color:#0b57d0;border-radius:12px;font-size:23px;font-weight:650}.seal{width:145px;height:145px;border:10px solid #0b57d0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:90px;color:#0b57d0}.bottom{position:absolute;bottom:27px;left:60px;right:60px;display:flex;justify-content:space-between;font:600 16px Arial;color:#38516f}.stage .title{font-size:25px;line-height:1.25;color:#173f7b;font-weight:700;text-align:center;height:70px;overflow:hidden}body[data-rtl="true"] h1,body[data-rtl="true"] p{text-align:right;direction:rtl}
</style></head><body><header><img src="../images/icon.png"><span>CWSAgent</span><span class="mark">LISTING TOOLKIT</span></header><div class="hero"><h1 id="title"></h1><p id="detail"></p></div><div class="stage" id="stage"></div><div class="bottom"><span id="brand">CWSAgent</span><span id="num"></span></div><script>
const q=new URLSearchParams(location.search),lang=q.get('lang')||'en',scene=Number(q.get('scene')||1),r=COPY[lang];document.documentElement.lang=lang.replace('_','-');document.body.dataset.rtl=['ar','he','fa'].includes(lang);document.getElementById('title').textContent=r[scene+1];document.getElementById('detail').textContent=r[scene+6];document.getElementById('num').textContent=`0${scene} / 05`;document.querySelector('.mark').textContent='CHROME + EDGE';
const pane=(content)=>`<div class="pane">${content}</div>`,bars='<div class="bar"></div><div class="bar"></div><div class="bar"></div>',arrow='<span class="arrow">→</span>',button='<div class="button">Sync</div>',file='<div class="glyph">▤</div><div class="code">meta/\n  listing.json\n  languages/\n  images/</div>';
const stages={1:pane(file)+arrow+pane(button+bars),2:pane('<div class="code">languages/\n  en/\n  de/\n  ja/\n  …</div>')+arrow+'<div class="lang-grid">'+Object.keys(COPY).map(l=>`<span class="chip">${l}</span>`).slice(0,28).join('')+'</div>',3:pane('<div class="glyph">▤</div><div class="title">Chrome Web Store</div>'+button)+pane('<div class="glyph">▤</div><div class="title">Microsoft Edge</div>'+button),4:pane(bars+'<div class="glyph">▧ ▧ ▧</div>')+arrow+pane('<div class="glyph">⇩</div><div class="code">listing.zip\n  languages/\n  images/</div>'),5:pane(button+bars)+arrow+'<div class="seal">✓</div>'+arrow+pane('<div class="title"></div><div class="glyph">▤</div>')};document.getElementById('stage').innerHTML=stages[scene];if(scene===5)document.querySelector('#stage .pane:last-child .title').textContent=r[6];
// Scene text is authored artwork. No live-console capture or verification occurs.
window.artworkReady=document.fonts.ready.then(()=>{for(const [id,base,min]of [['title',62,39],['detail',25,18]]){const e=document.getElementById(id);for(let px=base;px>=min;px--){e.style.fontSize=px+'px';if(e.scrollHeight<=e.clientHeight&&e.scrollWidth<=e.clientWidth)break}}});
</script></body></html>
